name: gpu-runtime-latency-build
'on':
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode version
        type: string
        default: '26.6'
      root_partition_name:
        description: UFS root GPT name
        type: choice
        options:
        - ios_root
        - userdata
        default: ios_root
permissions:
  contents: read
concurrency:
  group: gpu-runtime-latency-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UEFI: ${{ github.workspace }}/uefi-ishtar
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_PAT: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
      OWNER: ConCosew
      BUILD_USERDATA: 'false'
      DUMP_PAIRING: 'false'
      PUBLISH_KERNELCACHE: 'false'
      PUBLISH_USERDATA_IMAGE: 'false'
      ROOT_PARTITION_NAME: ios_root
      UNIXNU_KERNELCACHE: ${{ github.workspace }}/unixnu/out/ipsw/24A446/kernelcache.decompressed
      DUMP_CONTEXT: 'false'
    steps:
    - name: Check out the private UniXNU build tree
      uses: actions/checkout@v4
      with:
        repository: ConCosew/ishtar-unixnu
        ref: 7bbee47546603f265ac2f8587192be22532db333
        token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
        path: unixnu
        fetch-depth: 0
        persist-credentials: 'false'
    - name: Check out the private device repository (safe-checkpoint)
      uses: actions/checkout@v4
      with:
        repository: ConCosew/ishtar-device
        ref: 557360a0649a46de79832bd4d01ef02fb0def263
        token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
        path: device
        persist-credentials: 'false'
    - name: Check out the private uefi board package
      uses: actions/checkout@v4
      with:
        repository: ConCosew/ishtar-uefi
        ref: 7ccdd66a7cf13475f02ead61ee2b20a0930c224e
        token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
        path: uefi-ishtar
        persist-credentials: 'false'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Check out this workflow's tools
      uses: actions/checkout@v4
      with:
        path: ishtar-ci
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - name: Host tools
      run: "set -euo pipefail\nmkdir -p p4-report\nHOMEBREW_NO_AUTO_UPDATE=1 brew install -q llvm lld meson ninja\
        \ bison glslang spirv-tools shaderc mtools dtc unifdef\n          echo \"$(brew --prefix bison)/bin\" >>\
        \ \"$GITHUB_PATH\"\n          echo \"$(brew --prefix spirv-tools)/bin\" >> \"$GITHUB_PATH\"\n          echo\
        \ \"$(brew --prefix shaderc)/bin\" >> \"$GITHUB_PATH\"\n          rustup toolchain install 1.98.0 --profile\
        \ minimal\n          rustup component add rust-src --toolchain 1.98.0\nsw_vers >> p4-report/host.txt\nxcodebuild\
        \ -version >> p4-report/host.txt\ndf -h . >> p4-report/host.txt\n\nfor tool in glslangValidator spirv-val\
        \ glslc dtc unifdef; do\n  command -v \"$tool\" || { echo \"Required host tool missing: $tool\"; exit 1;\
        \ }\ndone\n"
    - name: Install pinned ipsw (verified)
      run: 'set -euo pipefail

        python3 ishtar-ci/tools/install-ipsw-pinned.py

        '
    - name: Preflight (fail in seconds, before the expensive steps)
      working-directory: unixnu
      run: "set -euo pipefail\necho \"== duplicate source appends in build-sheng-source-storage.py ==\"\npython3\
        \ - <<'PY'\nimport re\nfrom collections import Counter\nfrom pathlib import Path\np = Path('scripts/build-sheng-source-storage.py')\n\
        t = p.read_text()\nnames = re.findall(r\"device_source\\('([^']+)'\\)\", t)\nappends = re.findall(r\"sources\\\
        .append\\(device_source\\('([^']+)'\\)\\)\", t)\ndup = {k: v for k, v in Counter(appends).items() if v >\
        \ 1}\nprint('append count:', len(appends))\nprint('duplicates:', dup or 'none')\nif dup:\n    raise SystemExit('duplicate\
        \ archive sources: %s' % dup)\nprint('PREFLIGHT duplicate-source OK')\nPY\necho \"== GopFramebuffer pin\
        \ consistency ==\"\npython3 - <<'PY'\nimport re, subprocess\nfrom pathlib import Path\ncomp = Path('components.toml').read_text()\n\
        m = re.search(r'id = \"GopFramebuffer\"(.{0,600}?)revision = \"([0-9a-f]{40})\"', comp, re.S)\ncomp_pin\
        \ = m.group(2) if m else None\nlink = subprocess.run(['git', 'ls-tree', 'HEAD', 'drivers/GopFramebuffer'],\n\
        \                      capture_output=True, text=True).stdout.split()\nlink_pin = link[2] if len(link) >=\
        \ 3 else None\nprint('components.toml pin:', comp_pin)\nprint('drivers gitlink    :', link_pin)\nif comp_pin\
        \ != link_pin:\n    raise SystemExit('pin mismatch: the builder compiles the gitlink, so they must match')\n\
        print('PREFLIGHT pin OK')\nPY\necho \"== GopFramebuffer source symbols ==\"\ngit submodule update --init\
        \ --depth 1 drivers/GopFramebuffer 2>&1 | tail -2\npython3 - <<'PY'\nimport subprocess\nfrom pathlib import\
        \ Path\nneed = ['native_gop_virtual', 'native_legacy_direct_snapshot']\nforbid = ['native_adreno_fences']\n\
        text = ''\nfor f in ('NativeLegacyDisplay.cpp', 'NativeGOPPresenter.cpp'):\n    p = Path('drivers/GopFramebuffer')\
        \ / f\n    if p.is_file():\n        text += p.read_text()\nif not text:\n    raise SystemExit('drivers/GopFramebuffer\
        \ is empty; submodules not initialised')\nfor sym in need:\n    present = sym in text or 'native_legacy_direct'\
        \ in text\n    print(f'{\"have\" if present else \"MISSING\"} {sym}')\n    if not present:\n        raise\
        \ SystemExit(f'{sym} not found in the pinned GopFramebuffer')\nfor sym in forbid:\n    if sym in text:\n\
        \        raise SystemExit(f'{sym} is referenced but stage 0 builds no Adreno740')\nprint('PREFLIGHT symbols\
        \ OK')\nPY\n\necho \"== P3/T8 userdata static prerequisites ==\"\npython3 - <<'PY'\nimport tomllib\nfrom\
        \ pathlib import Path\nprof = tomllib.loads(Path('profiles/os/ios-27.0.1-24A446/profile.toml').read_text())\n\
        board = tomllib.loads(Path('../device/board.toml').read_text())\nu = board['userdata']\ncap = (u['last_lba']\
        \ - u['first_lba'] + 1) * u.get('lba_bytes', 4096)\nw = prof['userdata']['windows']\nassert w and w[0]['name']\
        \ == 'OS', w\nassert cap > 17 * 2**30, cap\nassert Path('scripts/unixnu/userdata.py').is_file()\nprint('PREFLIGHT\
        \ userdata OK: capacity %.1f GiB, windows %s' % (cap / 2**30, [x['name'] for x in w]))\nPY\n\nif [ \"$BUILD_USERDATA\"\
        \ = true ]; then\n  echo \"== object names expected by the iOS 27 source storage ==\"\n  python3 - <<'PY'\n\
        import tomllib\nfrom pathlib import Path\nprof = tomllib.loads(Path('profiles/os/ios-27.0.1-24A446/profile.toml').read_text())\n\
        names = [w['name'] + '.vroot' for w in prof['userdata']['windows']]\nassert names == ['OS.vroot', 'SystemOS.vroot'],\
        \ names\nprint('PREFLIGHT vroot objects OK:', names)\nPY\nfi\n\necho \"== uc2022 entitlement patch ==\"\n\
        grep -q 'gIOUserClientEntitlementsKey' ../device/patches/xnu-12377/ishtar-uc2022-default-locking.patch\n\
        echo \"PREFLIGHT uc2022 OK\"\n\necho \"== restored open cleanup ==\"\nif grep -q 'client->terminate();'\
        \ ../device/patches/xnu-12377/ishtar-uc2022-default-locking.patch; then\n  echo \"unexpected terminate workaround\"\
        ; exit 1\nfi\necho \"PREFLIGHT normal cleanup OK\"\n"
    - name: Verify reviewed constructor identity before downloads
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json

        from pathlib import Path

        fixture = json.loads(Path(''fixtures/fileset-fa07057b-symbols.json'').read_text())

        entries = [e for e in fixture[''functions''] if e[''original''] == ''0xfffffff00b35cac0'']

        assert len(entries) == 1

        assert entries[0][''native_symbol''] == ''__ZN12IOUserClientC2EPK11OSMetaClass''

        assert entries[0][''original_sha256''] == ''9d1511bca55aae2b728ad62a4ef063d4214610a266d77347e77ac2039bfb13d3''

        print(''PREFLIGHT constructor identity OK'')

        PY

        '
    - name: Verify reviewed VFS getter identities before downloads
      working-directory: unixnu
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nfixture = json.loads(Path('fixtures/fileset-fa07057b-symbols.json').read_text())\n\
        expected = {'0xfffffff00add321c': '_vfs_context_ucred', '0xfffffff00ad7ab64': '_bufattr_cpoff'}\nfor address,\
        \ name in expected.items():\n    rows = [e for e in fixture['functions'] if e['original'] == address]\n\
        \    assert len(rows) == 1 and rows[0]['native_symbol'] == name\n    assert rows[0]['original_sha256'] ==\
        \ '91fe54c083eb0b9168494a7cca1b46d068b795c7ba94ea2e14d0c8f9d165b9d5'\nprint('PREFLIGHT VFS getter identities\
        \ OK')\nPY\n"
    - name: Verify latency source contract
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        import tomllib

        b = tomllib.loads(Path(''../device/board.toml'').read_text())

        assert ''ishtar-latency=420'' in b[''payload''][''kernel_args'']

        assert ''install'' not in b[''payload'']

        p = Path(''../device/package'')

        assert (p/''BootLatency.inc'').is_file() and (p/''BootLatencyStages.h'').is_file()

        assert Path(''../device/reports/boot-latency-diagnostic.md'').is_file()

        assert Path(''../device/patches/xnu-12377/ishtar-boot-latency.patch'').is_file()

        assert ''ishtar-boot-latency.patch'' in Path(''../device/patches/xnu-12377/series'').read_text()

        print(''latency source contract PASS'')

        PY

        '
    - name: Private inputs (live FDT)
      working-directory: unixnu
      run: "set -uo pipefail\nmkdir -p out/ipsw/24A446\nrel=$(curl -fsSL -H \"Authorization: Bearer $GH_PAT\" \\\
        \n  \"https://api.github.com/repos/$OWNER/ishtar-device/releases/tags/checkpoint-inputs-2026-11-06\")\n\
        aid=$(printf '%s' \"$rel\" | jq -r '.assets[] | select(.name==\"ishtar.dtb\") | .id')\ncurl -fsSL -H \"\
        Authorization: Bearer $GH_PAT\" -H \"Accept: application/octet-stream\" \\\n  \"https://api.github.com/repos/$OWNER/ishtar-device/releases/assets/$aid\"\
        \ -o out/ipsw/24A446/ishtar.dtb\nsize=$(stat -f%z out/ipsw/24A446/ishtar.dtb)\necho \"live FDT: $size bytes\
        \ sha256 $(shasum -a 256 out/ipsw/24A446/ishtar.dtb | cut -d' ' -f1)\" | tee ../p4-report/inputs.txt\ntest\
        \ \"$size\" = \"901987\"\n"
    - name: defconfig / fetch / ipsw fetch / AEA decrypt
      working-directory: unixnu
      run: "set -uo pipefail\n./unixnu defconfig ishtar_ios27_defconfig -D ../device 2>&1 | tee -a ../p4-report/build.log\n\
        ./unixnu fetch -D ../device 2>&1 | tee -a ../p4-report/build.log\n./unixnu ipsw fetch -D ../device 2>&1\
        \ | tee -a ../p4-report/build.log\n./unixnu ipsw fetch OS Cryptex1,SystemOS -D ../device 2>&1 | tee -a ../p4-report/build.log\n\
        python3 - <<'PY' 2>&1 | tee -a ../p4-report/build.log\nimport sys\nsys.path.insert(0, 'scripts')\nfrom unixnu.ipsw\
        \ import decrypt_aea\nfrom pathlib import Path\nfor n in ('043-69909-664.dmg.aea', '043-68526-711.dmg.aea'):\n\
        \    p = Path('out/ipsw/24A446') / n\n    print('decrypt', n, p.is_file())\n    if p.is_file(): print('\
        \ -> decrypted', decrypt_aea(p).name)\nPY\n"
    - name: T5 owner root policies + T6 trust bundle
      working-directory: unixnu
      run: "set -euo pipefail\ngit submodule update --init --depth 1 -- kits/VerifiedRoot 2>&1 | tee -a ../p4-report/build.log\n\
        KEYS=build/verified-root-host/keys\nmkdir -p \"$KEYS\"\nopenssl genrsa -out \"$KEYS/owner.pem\" 3072 2>/dev/null\n\
        openssl rsa -in \"$KEYS/owner.pem\" -pubout -out \"$KEYS/owner-public.pem\" 2>/dev/null\nOPENSSL_PREFIX=$(brew\
        \ --prefix openssl@3 2>/dev/null || brew --prefix openssl)\nxcrun clang -std=c11 -Wall -Wextra -Werror -dynamiclib\
        \ \\\n  -I kits/VerifiedRoot/include -I \"$OPENSSL_PREFIX/include\" \\\n  kits/VerifiedRoot/src/verified_root.c\
        \ kits/VerifiedRoot/tests/openssl_provider.c \\\n  -L \"$OPENSSL_PREFIX/lib\" -lcrypto \\\n  -o build/verified-root-host/verified-root.dylib\
        \ 2>&1 | tee -a ../p4-report/build.log\nOUT=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/verified-root-24A446\n\
        python3 ../device/scripts/build-root-policies.py --unixnu . --profile ios-27.0.1-24A446 \\\n  --out \"$OUT\"\
        \ 2>&1 | tee -a ../p4-report/build.log\npython3 ../device/scripts/build-trust-bundle.py --ipsw-cache out/ipsw/24A446\
        \ 2>&1 | tee -a ../p4-report/build.log\nfor n in OS SystemOS; do\n  for f in manifest.bin trusted-key.bin\
        \ verification.json hashes.bin; do\n    test -f \"$OUT/$n/$f\" || { echo \"MISSING $n/$f\"; exit 1; }\n\
        \  done\ndone\necho \"T5/T6 PASS\" | tee -a ../p4-report/build.log\n"
    - name: Reuse tested GPU addon and trust inputs
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 ../ishtar-ci/tools/fetch-latency-baseline-gpu.py

        '
    - name: Stage offline GPU firmware and generated inputs
      working-directory: unixnu
      run: "set -euo pipefail\napi=\"https://api.github.com/repos/$OWNER/ishtar-device/releases/tags/rom-erofs-inputs-2026-11-12\"\
        \ncurl -fsSL -H \"Authorization: Bearer $GH_PAT\" \"$api\" > ../gpu-fw-release.json\nfwid=$(python3 -c \"\
        import json;print([a['id'] for a in json.load(open('../gpu-fw-release.json'))['assets'] if a['name']=='ishtar-gpu-firmware.tar.gz'][0])\"\
        )\ninid=$(python3 -c \"import json;print([a['id'] for a in json.load(open('../gpu-fw-release.json'))['assets']\
        \ if a['name']=='ishtar-gpu-build-inputs.tar.gz'][0])\")\nmkdir -p .cache/firmware/sheng-gpu .cache/ishtar\n\
        curl -fsSL -H \"Authorization: Bearer $GH_PAT\" -H \"Accept: application/octet-stream\"             \"https://api.github.com/repos/$OWNER/ishtar-device/releases/assets/$fwid\"\
        \ -o ../ishtar-gpu-firmware.tar.gz\ncurl -fsSL -H \"Authorization: Bearer $GH_PAT\" -H \"Accept: application/octet-stream\"\
        \             \"https://api.github.com/repos/$OWNER/ishtar-device/releases/assets/$inid\" -o ../ishtar-gpu-build-inputs.tar.gz\n\
        tar -xzf ../ishtar-gpu-firmware.tar.gz -C .cache/firmware/sheng-gpu\ntar -xzf ../ishtar-gpu-build-inputs.tar.gz\
        \ -C .\ngit checkout -- scripts\nfind .cache/firmware/sheng-gpu -type f | sort\ntest -s .cache/firmware/sheng-gpu/qcom/gmu_gen70200.bin\n\
        test -s .cache/firmware/sheng-gpu/qcom/a740_sqe.fw\ntest -s .cache/firmware/sheng-gpu/qcom/sm8550/sheng/a740_zap.mbn\n\
        test -s .cache/ishtar/ishtar.dtb\ntest -s scripts/build-ishtar-gpu-inputs.py\ntest -s scripts/build-adreno740-kits.py\n\
        test -s kits/sheng/ShengGmuVotes.c\n# The gpu-runtime branch carries coherent gitlinks; do not overwrite\
        \ them with old pins.\nfor d in kits/Sm8550Platform kits/AdrenoFirmware kits/AdrenoPM4 kits/ArmSmmu4K drivers/Adreno740\
        \ drivers/AdrenoMetal; do\n  git submodule update --init --depth 1 \"$d\"\ndone\ngit submodule status kits/Sm8550Platform\
        \ drivers/Adreno740 drivers/AdrenoMetal kits/ArmSmmu4K\npython3 scripts/build-ishtar-gpu-inputs.py\nfind\
        \ build/sheng-gmu build/sheng-gpu-smmu -type f | sort\n# unixnu.cli assembles a separate staged tree and\
        \ copies scripts there, but it does not\n# copy ignored cache/build inputs. Pre-seed the exact tree used\
        \ by this board profile.\ntree=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree\nmkdir -p \"$tree/kits\" \"\
        $tree/build/sheng-gmu\" \"$tree/build/sheng-gpu-smmu\"             \"$tree/.cache/ishtar\" \"$tree/.cache/adreno-source\"\
        \ \"$tree/.cache/linux-dts\"             \"$tree/.cache/firmware/sheng-gpu/qcom\" \"$tree/.cache/firmware/sheng-gpu/qcom/sm8550/sheng\"\
        \ncp build/sheng-gmu/*.h \"$tree/build/sheng-gmu/\"\ncp build/sheng-gpu-smmu/*.h \"$tree/build/sheng-gpu-smmu/\"\
        \ncp .cache/ishtar/ishtar.dtb \"$tree/.cache/ishtar/ishtar.dtb\"\ncp -a .cache/adreno-source/. \"$tree/.cache/adreno-source/\"\
        \ncp -a .cache/linux-dts/. \"$tree/.cache/linux-dts/\"\ncp -a .cache/firmware/sheng-gpu/. \"$tree/.cache/firmware/sheng-gpu/\"\
        \nmkdir -p \"$tree/kits/sheng\"\ncp kits/sheng/ShengGmuVotes.c \"$tree/kits/sheng/ShengGmuVotes.c\"\ncp\
        \ kits/sheng/audit-adreno-platform.py \"$tree/kits/sheng/audit-adreno-platform.py\"\ntest -s \"$tree/build/sheng-gmu/ShengGmuSource.h\"\
        \ntest -s \"$tree/kits/sheng/ShengGmuVotes.c\"\ntest -s \"$tree/.cache/firmware/sheng-gpu/qcom/sm8550/sheng/a740_zap.mbn\"\
        \n"
    - name: Reuse exact tested Data seed and UUID
      working-directory: unixnu
      run: 'set -euo pipefail

        CFG=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/.config

        SEEDDIR=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/data-seed

        mkdir -p "$SEEDDIR"

        python3 ../ishtar-ci/tools/use-latency-baseline-seed.py --unixnu . --config "$CFG" --out "$SEEDDIR" --report
        ../p4-report/data-baseline.json --path-output ../p4-report/data-seed.path

        '
    - name: Init uefi submodules and link the private Binaries
      working-directory: uefi-ishtar
      run: 'set -euo pipefail

        git submodule update --init --depth 1 2>&1 | tail -5 || true

        rm -rf Binaries

        git clone -q "https://x-access-token:$GH_PAT@github.com/$OWNER/ishtar-device-binaries.git" Binaries

        git -C Binaries checkout -q 67a2392eae79f921675777de0f550dc87e151db6

        echo "Binaries/ishtar files: $(find Binaries/ishtar -type f | wc -l)"

        '
    - name: P5 reviewed fixture
      working-directory: unixnu
      run: 'set -euo pipefail

        mkdir -p kits/XnuPrelink/fixtures

        cp fixtures/fileset-fa07057b-symbols.json kits/XnuPrelink/fixtures/

        ls -l kits/XnuPrelink/fixtures/

        '
    - name: GPU prelink marker layout
      working-directory: ${{ github.workspace }}
      run: 'set -euo pipefail

        python3 ishtar-ci/tools/patch-prelink-lastdataconst.py unixnu

        test -f unixnu/kits/XnuPrelink/fileset_layout.py

        grep -n "__LASTDATA_CONST" unixnu/kits/XnuPrelink/fileset_layout.py | head -8

        '
    - name: P5 UFS root partition name
      working-directory: ${{ github.workspace }}
      run: 'set -euo pipefail

        python3 "${{ github.workspace }}/ishtar-ci/tools/patch-ufs.py" "$ROOT_PARTITION_NAME"

        '
    - name: Build kernel
      working-directory: unixnu
      run: 'set -uo pipefail

        test -s "$UNIXNU_KERNELCACHE" || { echo "FATAL: local kernelcache missing: $UNIXNU_KERNELCACHE"; exit 1;
        }

        echo "prelink will use local kernelcache: $UNIXNU_KERNELCACHE ($(stat -f%z "$UNIXNU_KERNELCACHE") bytes)"

        ./unixnu build kernel -D ../device 2>&1 | tee -a ../p4-report/build.log

        K=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho

        test -f "$K" || { echo "kernel.macho MISSING"; exit 1; }

        echo "kernel.macho $(stat -f%z "$K") bytes sha256 $(shasum -a 256 "$K" | cut -d'' '' -f1)" | tee -a ../p4-report/artifacts.txt

        '
    - name: Verify APFS constructor binding
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 ../ishtar-ci/tools/check-apfs-constructor.py --module-dir kits/XnuPrelink --original out/ipsw/24A446/kernelcache.decompressed
        --kernel out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho --report ../p4-report/apfs-constructor.json

        '
    - name: Verify APFS VFS credential binding
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 ../ishtar-ci/tools/check-apfs-vfs-context.py --module-dir kits/XnuPrelink --original out/ipsw/24A446/kernelcache.decompressed
        --kernel out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho --report ../p4-report/apfs-vfs-context.json

        '
    - name: Verify emitted timing hooks and native geometry
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 ../ishtar-ci/tools/check-boot-latency.py --module-dir kits/XnuPrelink --kernel out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho
        --report ../p4-report/boot-latency.json

        '
    - name: Kernel bootstrap failure diagnostics
      if: ${{ failure() }}
      working-directory: unixnu
      run: "set -uo pipefail\nlogs=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/logs\nfor f in \"$logs/kernel-bootstrap.log\"\
        \ \"$logs/kernel.log\"; do\n  if [ -f \"$f\" ]; then\n    echo \"Diagnostic log: $f\"\n    grep -n -E -A\
        \ 5 -B 3 'error:|fatal error:|Error [0-9]|missing terminating|unterminated' \"$f\" | tail -180 || true\n\
        \    tail -60 \"$f\"\n  fi\ndone\n"
    - name: GPU prelink segment geometry (analysis only)
      working-directory: unixnu
      run: "set -uo pipefail\nN=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf\n\
        C=out/ipsw/24A446/kernelcache.decompressed\ntest -f \"$N\" || { echo \"native Mach-O absent\"; exit 0; }\n\
        python3 - \"$N\" \"$C\" <<'PYEOF'\nimport sys\nsys.path.insert(0, 'kits/XnuPrelink')\nfrom pathlib import\
        \ Path\nfrom kc_image import Image\nn=Image(Path(sys.argv[1]).read_bytes(),0)\nc=Image(Path(sys.argv[2]).read_bytes(),0)\n\
        print('native base',hex(n.base))\nfor s in n.segments:\n    if s['size']:print('native',s['name'],'va',hex(s['va']),'size',hex(s['size']),'file',hex(s['filesize']))\n\
        for s in n.sections:\n    if s['segment'] in ('__DATA_CONST','__LASTDATA_CONST','__DATA','__TEXT'):\n  \
        \    print('section',s['segment'],s['name'],'va',hex(s['va']),'size',hex(s['size']))\nroots={s['name']:s\
        \ for s in c.segments}\nfor name in ('__DATA_CONST','__DATA','__TEXT_EXEC'):\n    r=roots[name];print('cache',name,hex(r['va']),hex(r['size']))\n\
        PYEOF\n"
      if: ${{ always() }}
    - name: Build firmware
      working-directory: unixnu
      run: 'set -uo pipefail

        ./unixnu build package -D ../device 2>&1 | tee -a ../p4-report/build.log

        ./unixnu build firmware -D ../device --uefi ../uefi-ishtar 2>&1 | tee -a ../p4-report/build.log

        FD=../uefi-ishtar/Build/ishtarPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd

        test -f "$FD" || { echo "SILICIUM_UEFI.fd MISSING"; exit 1; }

        echo "FD $(stat -f%z "$FD") bytes sha256 $(shasum -a 256 "$FD" | cut -d'' '' -f1)" | tee -a ../p4-report/artifacts.txt

        test "$(stat -f%z "$FD")" = "3145728"

        '
    - name: Build controlled latency payload
      working-directory: unixnu
      run: "set -uo pipefail\nTC=build/original-static-system-trust/original-static-system.bundle\nSEED=$(sed 's/^DATA_SEED=//'\
        \ ../p4-report/data-seed.path)\ntest -s \"$SEED\" || { echo \"FATAL: Data seed missing for payload: $SEED\"\
        ; exit 1; }\n./unixnu build payload -D ../device --owner-trust-cache out/owner-trust.bundle --gpu-addon\
        \ out/gpuaddon.bin --data-ramdisk \"$SEED\" --unique-chip-id \"$UNIXNU_UNIQUE_CHIP_ID\" --kernel-arg sheng-gpu-addon=1\
        \ --kernel-arg ishtar-latency=420 2>&1 | tee -a ../p4-report/build.log\nP=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/payload/payload.json\n\
        test -f \"$P\" || { echo \"payload.json MISSING\"; exit 1; }\necho \"== kernel arg safety ==\" | tee ../p4-report/safety.txt\n\
        for bad in sheng-data-persist sheng-data-reset native-ufs-root native-source-storage; do\n  if grep -q \"\
        $bad\" \"$P\"; then echo \"UNSAFE $bad present\" | tee -a ../p4-report/safety.txt; else echo \"SAFE $bad\
        \ absent\" | tee -a ../p4-report/safety.txt; fi\ndone\nif [ \"gpu-runtime\" = \"safe-checkpoint\" ]; then\n\
        \  ! grep -q -E 'sheng-data-persist|sheng-data-reset|native-ufs-root|native-source-storage' \"$P\"\nelse\n\
        \  echo \"dual-boot/persistent root: root-write args are expected on gpu-runtime\"\nfi\n"
    - name: Verify controlled seed and diagnostic args
      working-directory: unixnu
      run: 'set -euo pipefail

        python3 - <<''PY''

        import hashlib, json

        from pathlib import Path

        payload = json.loads(Path(''out/ishtar/ios-27.0.1-24A446/ishtar_ios27/payload/payload.json'').read_text())

        base = json.loads(Path(''../p4-report/data-baseline.json'').read_text())

        assert payload[''skip_setup''] is False

        assert payload[''data_ramdisk_sha256''] == base[''data_ramdisk_sha256'']

        assert base[''result''] == ''PASS''

        assert payload[''gpu_addon_sha256''] == ''1f58109d7bd75984da9a74635936f5f7db880f3e4c13dea58a486b01cb7084a7''

        assert payload[''trust_cache_sha256''] == ''a963d31f047723f775c64c7b59ccc7f8053fec98ad892f305f84182432e766a7''

        args = payload[''kernel_args''].split()

        assert args == [''-v'', ''serial=3'', ''debug=0x14e'', ''kt_fixed_zones=120'', ''-no_slto_panic'', ''use_contiguous_hint=0'',
        ''native-source-storage=1'', ''native-ufs-root=1'', ''sheng-data-persist=2'', ''offline-mobile-graphics-load=1'',
        ''offline-mobile-graphics-client=1'', ''offline-iogpu-load=1'', ''sheng-fb-gpu=1'', ''offline-legacy-register=1'',
        ''offline-legacy-gop=1'', ''offline-legacy-unit-scale=3'', ''offline-legacy-pm=1'', ''offline-legacy-validate=1'',
        ''offline-legacy-transfer=1'', ''offline-legacy-cpu-present=1'', ''offline-legacy-phase=4'', ''offline-key-events=1'',
        ''sheng-aks=1'', ''sheng-gpu-addon=1'', ''ishtar-latency=420''], ''payload arguments differ from the tested
        boot plus latency opt-in''

        assert len(args) == len({arg.split(''='', 1)[0] for arg in args})

        base[''kernel_args''] = args

        base[''payload_checks''] = ''PASS''

        Path(''../p4-report/data-baseline.json'').write_text(json.dumps(base, indent=2) + ''

        '')

        print(''controlled baseline payload PASS'')

        PY

        '
    - name: bootimg (header v0)
      working-directory: unixnu
      run: 'set -uo pipefail

        ./unixnu bootimg -D ../device --uefi ../uefi-ishtar --dtb out/ipsw/24A446/ishtar.dtb 2>&1 | tee -a ../p4-report/build.log

        B=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.img

        J=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.json

        test -f "$B" || { echo "boot.img MISSING"; exit 1; }

        cp "$J" ../p4-report/boot.json

        echo "boot.img $(stat -f%z "$B") bytes sha256 $(shasum -a 256 "$B" | cut -d'' '' -f1)" | tee -a ../p4-report/artifacts.txt

        python3 - <<''PY'' | tee ../p4-report/boot-verification.txt

        import json

        d = json.load(open(''../p4-report/boot.json''))

        print(''header_version ='', d.get(''header_version''))

        print(''ramdisk_bytes  ='', d.get(''ramdisk_bytes''))

        print(''pagesize       ='', d.get(''pagesize''))

        assert d.get(''header_version'') == 0

        assert (d.get(''ramdisk_bytes'') or 0) > 0

        print(''BOOTIMG PASS'')

        PY

        '
    - name: Publish latency diagnostic prerelease
      if: ${{ success() }}
      working-directory: unixnu
      env:
        GH_TOKEN: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
        TAG: gpu-runtime-latency-${{ github.run_id }}
      run: 'set -euo pipefail

        B=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.img

        K=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho

        P=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/payload/payload.img

        test -s "$B" && test -s "$K" && test -s "$P"

        test -s out/gpuaddon.bin && test -s out/owner-trust.bundle

        ( cd out && shasum -a 256 gpuaddon.bin owner-trust.bundle ) > gpu-runtime-sha256.txt

        shasum -a 256 "$B" "$K" "$P" ../p4-report/apfs-constructor.json ../p4-report/apfs-vfs-context.json ../p4-report/data-baseline.json
        ../p4-report/boot-latency.json >> gpu-runtime-sha256.txt

        cat > gpu-runtime-notes.md <<''NOTES''

        Boot latency diagnostic. This image intentionally stops in a panic snapshot 420 seconds after the kernel
        clock-service sample. It is not a performance fix or normal-runtime build.


        - User timing is in minutes: logo ~3, upgrade UI ~6, black ~8, manual restart ~10. This image measures kernel/storage/mount/addon/user-space
        checkpoints without UFS log extraction.

        - Reuses the exact tested 44246601490 seed, APFS UUID, GPU addon and owner trust bytes; no Setup/no-auto-dim
        transform. Existing APFS constructor and VFS binding gates remain.

        - data-baseline.json verifies seed/input hashes and payload args; boot-latency.json verifies emitted timing
        hooks. Neither report is hardware qualification.

        - No touch driver or speed improvement is claimed. Record complete snapshot; firmware/fastboot time before
        kernel clock is outside coverage. Scheduling may delay the stop.

        - Exact seed reuse does not prove the stored overlay matches. Read overlay state/header; do not reset Data.
        This diagnostic omits the erase-data menu.

        - Owner performs fastboot boot only. Do not flash boot/userdata or alter partitions.

        NOTES

        gh release create "$TAG" --repo ConCosew/ishtar-device --target 557360a0649a46de79832bd4d01ef02fb0def263 --title "GPU runtime
        $TAG" --notes-file gpu-runtime-notes.md --prerelease --latest=false

        gh release upload "$TAG" "$B" "$K" "$P" out/gpuaddon.bin out/owner-trust.bundle gpu-runtime-sha256.txt ../p4-report/apfs-constructor.json
        ../p4-report/apfs-vfs-context.json ../p4-report/data-baseline.json ../p4-report/boot-latency.json --repo
        ConCosew/ishtar-device --clobber

        echo "published GPU runtime release $TAG"

        '
    - name: GPU runtime build report
      if: ${{ always() }}
      working-directory: unixnu
      run: "set -uo pipefail\nfor f in out/gpuaddon.bin out/owner-trust.bundle out/ishtar/ios-27.0.1-24A446/ishtar_ios27/payload/payload.img\
        \ out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.img; do\n  if [ -f \"$f\" ]; then\n    echo \"$f $(stat\
        \ -f%z \"$f\") bytes sha256 $(shasum -a 256 \"$f\" | cut -d' ' -f1)\"\n  fi\ndone"
