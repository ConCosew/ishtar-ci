name: p4-checkpoint
on:
  workflow_dispatch:
    inputs:
      xcode:
        default: "26.6"
      device_ref:
        description: Device repository ref (dual-boot points userdata at ios_root)
        type: string
        default: safe-checkpoint
      publish_userdata_image:
        description: Attach the real userdata-root.img to the private Release (16 GiB, user downloads)
        type: boolean
        default: false
      build_userdata:
        description: Build the P3/T8 userdata evidence (never flashed; only JSON leaves the runner)
        type: boolean
        default: false
      dump_pairing:
        description: Dump the XnuPrelink kext-facing pairing report (analysis only)
        type: boolean
        default: false
      dump_context:
        description: Dump original-side call context for the hottest unnamed targets
        type: boolean
        default: false
      publish_kernelcache:
        description: Attach the decompressed kernelcache to the private Release (offline analysis)
        type: boolean
        default: false
      stub_gate:
        description: strict fails the job while panic stubs remain; off allows a milestone boot.img
        type: choice
        options:
          - strict
          - "off"
        default: strict
permissions:
  contents: read
concurrency:
  group: p4-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UEFI: ${{ github.workspace }}/uefi-ishtar
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_PAT: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
      OWNER: ConCosew
      BUILD_USERDATA: ${{ inputs.build_userdata }}
      DUMP_PAIRING: ${{ inputs.dump_pairing }}
      PUBLISH_KERNELCACHE: ${{ inputs.publish_kernelcache }}
      PUBLISH_USERDATA_IMAGE: ${{ inputs.publish_userdata_image }}
    steps:
      - name: Check out the private UniXNU build tree
        uses: actions/checkout@v4
        with:
          repository: ConCosew/ishtar-unixnu
          ref: ishtar-build
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
          path: unixnu
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the private device repository (safe-checkpoint)
        uses: actions/checkout@v4
        with:
          repository: ConCosew/ishtar-device
          ref: ${{ inputs.device_ref }}
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
          path: device
          persist-credentials: false
      - name: Check out the private uefi board package
        uses: actions/checkout@v4
        with:
          repository: ConCosew/ishtar-uefi
          ref: ishtar
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
          path: uefi-ishtar
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Host tools
        run: |
          set -euo pipefail
          mkdir -p p4-report
          HOMEBREW_NO_AUTO_UPDATE=1 brew install -q llvm lld mtools dtc unifdef blacktop/tap/ipsw || true
          sw_vers >> p4-report/host.txt
          xcodebuild -version >> p4-report/host.txt
          df -h . >> p4-report/host.txt

      - name: Preflight (fail in seconds, before the expensive steps)
        working-directory: unixnu
        run: |
          set -euo pipefail
          echo "== duplicate source appends in build-sheng-source-storage.py =="
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          p = Path('scripts/build-sheng-source-storage.py')
          t = p.read_text()
          names = re.findall(r"device_source\('([^']+)'\)", t)
          appends = re.findall(r"sources\.append\(device_source\('([^']+)'\)\)", t)
          dup = {k: v for k, v in Counter(appends).items() if v > 1}
          print('append count:', len(appends))
          print('duplicates:', dup or 'none')
          if dup:
              raise SystemExit('duplicate archive sources: %s' % dup)
          print('PREFLIGHT duplicate-source OK')
          PY
          echo "== GopFramebuffer pin consistency =="
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          comp = Path('components.toml').read_text()
          m = re.search(r'id = "GopFramebuffer"(.{0,600}?)revision = "([0-9a-f]{40})"', comp, re.S)
          comp_pin = m.group(2) if m else None
          link = subprocess.run(['git', 'ls-tree', 'HEAD', 'drivers/GopFramebuffer'],
                                capture_output=True, text=True).stdout.split()
          link_pin = link[2] if len(link) >= 3 else None
          print('components.toml pin:', comp_pin)
          print('drivers gitlink    :', link_pin)
          if comp_pin != link_pin:
              raise SystemExit('pin mismatch: the builder compiles the gitlink, so they must match')
          print('PREFLIGHT pin OK')
          PY
          echo "== GopFramebuffer source symbols =="
          git submodule update --init --depth 1 drivers/GopFramebuffer 2>&1 | tail -2
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          need = ['native_gop_virtual', 'native_legacy_direct_snapshot']
          forbid = ['native_adreno_fences']
          text = ''
          for f in ('NativeLegacyDisplay.cpp', 'NativeGOPPresenter.cpp'):
              p = Path('drivers/GopFramebuffer') / f
              if p.is_file():
                  text += p.read_text()
          if not text:
              raise SystemExit('drivers/GopFramebuffer is empty; submodules not initialised')
          for sym in need:
              present = sym in text or 'native_legacy_direct' in text
              print(f'{"have" if present else "MISSING"} {sym}')
              if not present:
                  raise SystemExit(f'{sym} not found in the pinned GopFramebuffer')
          for sym in forbid:
              if sym in text:
                  raise SystemExit(f'{sym} is referenced but stage 0 builds no Adreno740')
          print('PREFLIGHT symbols OK')
          PY

          echo "== P3/T8 userdata static prerequisites =="
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          prof = tomllib.loads(Path('profiles/os/ios-27.0.1-24A446/profile.toml').read_text())
          board = tomllib.loads(Path('../device/board.toml').read_text())
          u = board['userdata']
          cap = (u['last_lba'] - u['first_lba'] + 1) * u.get('lba_bytes', 4096)
          w = prof['userdata']['windows']
          assert w and w[0]['name'] == 'OS', w
          assert cap > 17 * 2**30, cap
          assert Path('scripts/unixnu/userdata.py').is_file()
          print('PREFLIGHT userdata OK: capacity %.1f GiB, windows %s' % (cap / 2**30, [x['name'] for x in w]))
          PY

          if [ "$BUILD_USERDATA" = true ]; then
            echo "== object names expected by the iOS 27 source storage =="
            python3 - <<'PY'
          import tomllib
          from pathlib import Path
          prof = tomllib.loads(Path('profiles/os/ios-27.0.1-24A446/profile.toml').read_text())
          names = [w['name'] + '.vroot' for w in prof['userdata']['windows']]
          assert names == ['OS.vroot', 'SystemOS.vroot'], names
          print('PREFLIGHT vroot objects OK:', names)
          PY
          fi
      - name: Private inputs (live FDT)
        working-directory: unixnu
        run: |
          set -uo pipefail
          mkdir -p out/ipsw/24A446
          rel=$(curl -fsSL -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/repos/$OWNER/ishtar-device/releases/tags/checkpoint-inputs-2026-11-06")
          aid=$(printf '%s' "$rel" | jq -r '.assets[] | select(.name=="ishtar.dtb") | .id')
          curl -fsSL -H "Authorization: Bearer $GH_PAT" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$OWNER/ishtar-device/releases/assets/$aid" -o out/ipsw/24A446/ishtar.dtb
          size=$(stat -f%z out/ipsw/24A446/ishtar.dtb)
          echo "live FDT: $size bytes sha256 $(shasum -a 256 out/ipsw/24A446/ishtar.dtb | cut -d' ' -f1)" | tee ../p4-report/inputs.txt
          test "$size" = "901987"

      - name: defconfig / fetch / ipsw fetch / AEA decrypt
        working-directory: unixnu
        run: |
          set -uo pipefail
          ./unixnu defconfig ishtar_ios27_defconfig -D ../device 2>&1 | tee -a ../p4-report/build.log
          ./unixnu fetch -D ../device 2>&1 | tee -a ../p4-report/build.log
          ./unixnu ipsw fetch -D ../device 2>&1 | tee -a ../p4-report/build.log
          ./unixnu ipsw fetch OS Cryptex1,SystemOS -D ../device 2>&1 | tee -a ../p4-report/build.log
          python3 - <<'PY' 2>&1 | tee -a ../p4-report/build.log
          import sys
          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import decrypt_aea
          from pathlib import Path
          for n in ('043-69909-664.dmg.aea', '043-68526-711.dmg.aea'):
              p = Path('out/ipsw/24A446') / n
              print('decrypt', n, p.is_file())
              if p.is_file(): print(' -> decrypted', decrypt_aea(p).name)
          PY

      - name: T5 owner root policies + T6 trust bundle
        working-directory: unixnu
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- kits/VerifiedRoot 2>&1 | tee -a ../p4-report/build.log
          KEYS=build/verified-root-host/keys
          mkdir -p "$KEYS"
          openssl genrsa -out "$KEYS/owner.pem" 3072 2>/dev/null
          openssl rsa -in "$KEYS/owner.pem" -pubout -out "$KEYS/owner-public.pem" 2>/dev/null
          OPENSSL_PREFIX=$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)
          xcrun clang -std=c11 -Wall -Wextra -Werror -dynamiclib \
            -I kits/VerifiedRoot/include -I "$OPENSSL_PREFIX/include" \
            kits/VerifiedRoot/src/verified_root.c kits/VerifiedRoot/tests/openssl_provider.c \
            -L "$OPENSSL_PREFIX/lib" -lcrypto \
            -o build/verified-root-host/verified-root.dylib 2>&1 | tee -a ../p4-report/build.log
          OUT=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/verified-root-24A446
          python3 ../device/scripts/build-root-policies.py --unixnu . --profile ios-27.0.1-24A446 \
            --out "$OUT" 2>&1 | tee -a ../p4-report/build.log
          python3 ../device/scripts/build-trust-bundle.py --ipsw-cache out/ipsw/24A446 2>&1 | tee -a ../p4-report/build.log
          for n in OS SystemOS; do
            for f in manifest.bin trusted-key.bin verification.json hashes.bin; do
              test -f "$OUT/$n/$f" || { echo "MISSING $n/$f"; exit 1; }
            done
          done
          echo "T5/T6 PASS" | tee -a ../p4-report/build.log

      - name: P3/T8 userdata evidence (never flashed)
        if: ${{ inputs.build_userdata }}
        working-directory: unixnu
        run: |
          set -euo pipefail
          FREE=$(df -k . | tail -1 | awk '{print $4}')
          echo "free disk: $FREE KiB"
          test "$FREE" -gt 25000000 || { echo "insufficient disk for the 16 GiB userdata image"; exit 1; }
          OUT=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/verified-root-24A446
          for n in OS SystemOS; do
            test -s "$OUT/$n/hashes.bin" || { echo "MISSING $n/hashes.bin"; exit 1; }
          done
          ./unixnu build userdata --dry-run -D ../device 2>&1 | tee -a ../p4-report/build.log
          ./unixnu build userdata -D ../device \
            --object "OS.vroot=$OUT/OS/hashes.bin" \
            --object "SystemOS.vroot=$OUT/SystemOS/hashes.bin" 2>&1 | tee -a ../p4-report/build.log
          U=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/userdata/userdata-root.json
          test -f "$U" || { echo "userdata-root.json MISSING"; exit 1; }
          cp "$U" ../p4-report/userdata-root.json
          if [ "$PUBLISH_USERDATA_IMAGE" = true ]; then
            IMG=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/userdata/userdata-root.img
            test -f "$IMG" || { echo "userdata-root.img MISSING"; exit 1; }
            cp "$IMG" ../p4-report/userdata-root.img
            echo "userdata-root.img $(stat -f%z ../p4-report/userdata-root.img) bytes sha256 $(shasum -a 256 ../p4-report/userdata-root.img | cut -d' ' -f1)" | tee -a ../p4-report/artifacts.txt
          fi
          python3 - <<'PY' | tee ../p4-report/userdata-verification.txt
          import json
          d = json.load(open('../p4-report/userdata-root.json'))
          print('image_bytes   =', d['image_bytes'])
          print('image_sha256  =', d['image_sha256'])
          print('userdata_bytes=', d['userdata_bytes'])
          for w in d['windows']:
              print('window', w['name'], w['offset'], w['size'])
          for o in d['objects']:
              print('object', o['name'], o['offset'], o['size'])
          assert d['image_bytes'] <= d['userdata_bytes']
          assert len(d['windows']) >= 1
          names = {o['name'] for o in d['objects']}
          assert {'OS.vroot', 'SystemOS.vroot'} <= names, names
          print('USERDATA PASS (not flashed)')
          PY
      - name: Init uefi submodules and link the private Binaries
        working-directory: uefi-ishtar
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 2>&1 | tail -5 || true
          rm -rf Binaries
          git clone -q "https://x-access-token:$GH_PAT@github.com/$OWNER/ishtar-device-binaries.git" Binaries
          git -C Binaries checkout -q 67a2392eae79f921675777de0f550dc87e151db6
          echo "Binaries/ishtar files: $(find Binaries/ishtar -type f | wc -l)"

      - name: P5 reviewed fixture
        working-directory: unixnu
        run: |
          set -euo pipefail
          mkdir -p kits/XnuPrelink/fixtures
          cp fixtures/fileset-fa07057b-symbols.json kits/XnuPrelink/fixtures/
          ls -l kits/XnuPrelink/fixtures/
      - name: Build kernel
        working-directory: unixnu
        run: |
          set -uo pipefail
          ./unixnu build kernel -D ../device 2>&1 | tee -a ../p4-report/build.log
          K=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho
          test -f "$K" || { echo "kernel.macho MISSING"; exit 1; }
          echo "kernel.macho $(stat -f%z "$K") bytes sha256 $(shasum -a 256 "$K" | cut -d' ' -f1)" | tee -a ../p4-report/artifacts.txt

      - name: P5 prelink pairing report (analysis only)
        if: ${{ inputs.dump_pairing }}
        working-directory: unixnu
        run: |
          set -uo pipefail
          K=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          R=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
          python3 kits/XnuPrelink/fileset_match.py out/ipsw/24A446/kernelcache.decompressed "$K" --reference-kernel "$R" --out ../p4-report/pairing.json 2>&1 | tee ../p4-report/pairing.log || true
          python3 - "$K" "$R" <<'PY' 2>&1 | tee -a ../p4-report/pairing.log || true
          import json, sys, traceback
          from pathlib import Path
          sys.path.insert(0, 'kits/XnuPrelink')
          out = Path('../p4-report/p5-unmapped.txt')
          try:
              import fileset_match as fm
              raw = Path('out/ipsw/24A446/kernelcache.decompressed').read_bytes()
              native = Path(sys.argv[1]).read_bytes()
              ref = Path(sys.argv[2]).read_bytes()
              cap = {}
              original_report = fm.Matcher.report
              def report(self, data):
                  cap['matcher'] = self
                  cap['data'] = data
                  return original_report(self, data)
              fm.Matcher.report = report
              payload = fm.match_images(raw, native, 'com.apple.kernel', 40, ref)
              m, data = cap['matcher'], cap['data']
              cache = fm.Image(raw)
              _, at = cache.entries['com.apple.kernel']
              entry = fm.Image(raw, at)
              fixups = cache.fixups()
              kernel = entry.mapped()
              inside = lambda a: any(b <= a < e for b, e in kernel)
              targets = {f[0] for s, f in fixups.items() if inside(f[0]) and not inside(s)}
              ranges = []
              for name, value in cache.entries.items():
                  offset = value[1] if isinstance(value, tuple) else value
                  try:
                      for b, e in fm.Image(raw, offset).mapped():
                          ranges.append((b, e, name))
                  except Exception:
                      pass
              def owner(a):
                  for b, e, n in ranges:
                      if b <= a < e:
                          return n
                  return '?'
              sites = {}
              for s, f in fixups.items():
                  sites.setdefault(f[0], []).append(s)
              head = ['# P5 unnamed kext-facing targets',
                      '# kernelcache_sha256 ' + payload['inputs']['kernelcache_sha256'],
                      '# native_sha256 ' + payload['inputs']['native_sha256'],
                      '# kext_targets %d named %d unnamed %d' % (
                          len(targets),
                          sum(1 for t in targets if t in m.pairs or (t in data and data[t] and m.native.name_at(data[t][0])[0])),
                          sum(1 for t in targets if not (t in m.pairs or (t in data and data[t] and m.native.name_at(data[t][0])[0])))),
                      '# columns: original_target  refs  kext(s)  first_sites',
                      '']
              rows = []
              for t in sorted(targets):
                  if t in m.pairs or (t in data and data[t] and m.native.name_at(data[t][0])[0]):
                      continue
                  ss = sites.get(t, [])
                  ks = sorted({owner(s) for s in ss})
                  rows.append('%#x  refs=%d  kexts=%s  sites=%s' % (
                      t, len(ss), ','.join(ks) or '?', ','.join('%#x' % s for s in ss[:4])))
              out.write_text('\n'.join(head + rows) + '\n')
              print('wrote %s: %d unnamed targets (of %d)' % (out, len(rows), len(targets)))
          except Exception:
              traceback.print_exc()
              out.write_text('# FAILED to compute the unnamed list, see the log above\n')
          PY
          python3 - ../p4-report/pairing.json <<'PY' | tee -a ../p4-report/pairing.log || true
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d.get('stats', {})
          print('kext_targets', s.get('kext_targets'), 'named', s.get('kext_targets_named'))
          print('functions', s.get('functions_matched'), '/', s.get('functions_original'))
          PY
          head -6 ../p4-report/p5-unmapped.txt || true
      - name: P5 target context (analysis only)
        if: ${{ inputs.dump_context }}
        working-directory: unixnu
        run: |
          set -uo pipefail
          python3 - <<'PY' 2>&1 | tee ../p4-report/p5-context.log || true
          import collections, struct
          from pathlib import Path

          TOP = 30
          WINDOW = 12
          kc = Path('out/ipsw/24A446/kernelcache.decompressed').read_bytes()
          d = kc

          # ---- index every fileset entry: name -> [(seg, start, end, fileoff)] ----
          entries = []
          ncmds = struct.unpack_from('<I', d, 16)[0]
          p = 32
          for _ in range(ncmds):
              cmd, size = struct.unpack_from('<II', d, p)
              if cmd == 0x80000035:
                  vm, fo, ilen, _ = struct.unpack_from('<QQII', d, p + 8)
                  name = d[p + 32:p + 32 + ilen].split(b'\0')[0].decode('latin-1', 'replace')
                  sub = []
                  q = fo + 32
                  for _ in range(struct.unpack_from('<I', d, fo + 16)[0]):
                      c, s = struct.unpack_from('<II', d, q)
                      if c == 0x19:
                          seg = d[q + 8:q + 24].split(b'\0')[0].decode('latin-1', 'replace')
                          svm, svs, sfo, sfs = struct.unpack_from('<QQQQ', d, q + 24)
                          sub.append((seg, svm, svm + svs, sfo))
                      q += s
                  entries.append((name, sub))
              p += size

          def owner(addr):
              for name, segs in entries:
                  for seg, lo, hi, fo in segs:
                      if lo <= addr < hi:
                          return name, seg, fo + (addr - lo)
              return None, None, None

          def rd(addr, n=8):
              name, seg, off = owner(addr)
              if off is None:
                  return b''
              return d[off:off + n]

          def cstr(addr, limit=48):
              raw = rd(addr, limit)
              cut = raw.find(b'\0')
              raw = raw[:cut] if cut >= 0 else raw
              if len(raw) >= 4 and all(32 <= c < 127 for c in raw):
                  return raw.decode('latin-1')
              return None

          def word(addr):
              _, _, off = owner(addr)
              if off is None:
                  return None
              return struct.unpack_from('<I', d, off)[0]

          def adrp(ins, pc):
              immlo, immhi = (ins >> 29) & 3, (ins >> 5) & 0x7FFFF
              imm = ((immhi << 2) | immlo) << 12
              if imm >> 32:
                  imm -= 1 << 33
              return (pc & ~0xFFF) + imm

          def branch(ins, pc):
              if (ins >> 26) != 0x25 and (ins >> 26) != 0x05:
                  return None
              imm = ins & 0x3FFFFFF
              if imm & 0x2000000:
                  imm -= 0x4000000
              return pc + imm * 4

          def addimm(ins):
              return ((ins >> 10) & 0xFFF) << (12 * ((ins >> 22) & 1))

          def ldr_off(ins):
              return ((ins >> 10) & 0xFFF) * 8

          def scan_calls(target, limit=3):
              """direct bl to target"""
              out = []
              for name, segs in entries:
                  for seg, lo, hi, fo in segs:
                      if seg != '__TEXT_EXEC':
                          continue
                      for i in range(0, hi - lo - 4, 4):
                          w = struct.unpack_from('<I', d, fo + i)[0]
                          if (w >> 26) == 0x25:
                              imm = w & 0x3FFFFFF
                              if imm & 0x2000000:
                                  imm -= 0x4000000
                              if lo + i + imm * 4 == target:
                                  out.append(lo + i)
                                  if len(out) >= limit:
                                      return out
              return out

          def scan_loads(slot, limit=3):
              """adrp (+add/ldr) resolving to the slot, inside the kext that owns the slot"""
              owner_name, _, _ = owner(slot)
              out = []
              for name, segs in entries:
                  if name != owner_name:
                      continue
                  for seg, lo, hi, fo in segs:
                      if seg != '__TEXT_EXEC':
                          continue
                      for i in range(0, hi - lo - 16, 4):
                          w = struct.unpack_from('<I', d, fo + i)[0]
                          if (w & 0x9F00001F) != 0x90000000:
                              continue
                          page = adrp(w, lo + i)
                          for k in (4, 8, 12):
                              w2 = struct.unpack_from('<I', d, fo + i + k)[0]
                              if (w2 & 0xFF800000) == 0xF9400000:
                                  if page + ldr_off(w2) == slot:
                                      out.append(lo + i)
                                      break
                              if (w2 & 0xFF800000) == 0x91000000:
                                  if page + addimm(w2) == slot:
                                      out.append(lo + i)
                                      break
                          if len(out) >= limit:
                              return out
              return out

          def describe(addr, count=WINDOW):
              lines = []
              for k in range(count):
                  a = addr + 4 * k
                  w = word(a)
                  if w is None:
                      break
                  note = ''
                  b = branch(w, a)
                  if b is not None:
                      n, s, _ = owner(b)
                      note = ('BL -> %#x  %s:%s' if (w >> 26) == 0x25 else 'B  -> %#x  %s:%s') % (
                          b, n or '?', s or '?')
                  elif (w & 0x9F00001F) == 0x90000000:
                      note = 'adrp -> %#x' % adrp(w, a)
                  elif (w & 0xFF800000) == 0xF9400000:
                      note = 'ldr [x?, #%#x]' % ldr_off(w)
                  elif (w & 0xFF800000) == 0x91000000:
                      note = 'add #%#x' % addimm(w)
                  lines.append('    %#018x  %08x  %s' % (a, w, note))
              return lines

          rows = []
          for line in Path('../p4-report/p5-unmapped.txt').read_text().splitlines():
              if line.startswith('#') or not line.strip():
                  continue
              addr, rest = line.split(None, 1)
              refs = int(rest.split('refs=')[1].split()[0])
              kexts = rest.split('kexts=')[1].split()[0]
              sites = rest.split('sites=')[1].split()[0].split(',')
              rows.append((refs, int(addr, 16), kexts, [int(s, 16) for s in sites if s.startswith('0x')]))
          rows.sort(reverse=True)
          top = rows[:TOP]
          want_targets = {t for _, t, _, _ in top}
          want_slots = {s for _, _, _, ss in top for s in ss[:2]}

          call_index = collections.defaultdict(list)
          load_index = collections.defaultdict(list)
          for name, segs in entries:
              for seg, lo, hi, fo in segs:
                  if seg != '__TEXT_EXEC':
                      continue
                  for i in range(0, hi - lo - 16, 4):
                      w = struct.unpack_from('<I', d, fo + i)[0]
                      pc = lo + i
                      if (w >> 26) == 0x25:
                          imm = w & 0x3FFFFFF
                          if imm & 0x2000000:
                              imm -= 0x4000000
                          tgt = pc + imm * 4
                          if tgt in want_targets:
                              call_index[tgt].append(pc)
                      elif (w & 0x9F00001F) == 0x90000000:
                          page = adrp(w, pc)
                          for k in (4, 8, 12):
                              w2 = struct.unpack_from('<I', d, fo + i + k)[0]
                              if (w2 & 0xFF800000) == 0xF9400000:
                                  a2 = page + ldr_off(w2)
                              elif (w2 & 0xFF800000) == 0x91000000:
                                  a2 = page + addimm(w2)
                              else:
                                  continue
                              if a2 in want_slots:
                                  load_index[a2].append(pc)
                              break
          print('index: %d targets with direct calls, %d slots with loaders' % (len(call_index), len(load_index)))

          out = ['# P5 top-%d unnamed targets: original-side context' % TOP,
                 '# kernelcache %s' % Path('out/ipsw/24A446/kernelcache.decompressed').name,
                 '# columns: target | refs | kexts | GOT slot | call sites',
                 '']
          for refs, target, kexts, sites in top:
              out.append('=' * 100)
              out.append('%#x  refs=%d  kexts=%s' % (target, refs, kexts))
              for slot in sites[:2]:
                  out.append('  GOT slot %#018x  owner=%s' % (slot, owner(slot)[0] or '?'))
                  loads = load_index.get(slot, [])[:3]
                  out.append('  loads: %s' % (', '.join('%#x' % x for x in loads) or 'none in kext text'))
                  for a in loads[:2]:
                      out.extend(describe(max(a - 8, a - 32), 14))
              calls = call_index.get(target, [])[:3]
              out.append('  direct calls: %s' % (', '.join('%#x' % x for x in calls) or 'none'))
              for a in calls[:2]:
                  out.extend(describe(max(a - 32, a - 96), 12))
              out.append('  target bytes: %s' % rd(target, 16).hex())
              s = cstr(target)
              if s:
                  out.append('  target is a string: %r' % s)
          Path('../p4-report/p5-context.txt').write_text('\n'.join(out) + '\n')
          print('wrote p5-context.txt: %d targets, %d lines' % (min(TOP, len(top)), len(out)))
          PY
          head -40 ../p4-report/p5-context.log || true
      - name: Stub gate (fail while any kext call still lands on the panic stub)
        if: ${{ inputs.stub_gate == 'strict' }}
        working-directory: unixnu
        run: |
          set -uo pipefail
          python3 - <<'PY' 2>&1 | tee ../p4-report/stub-gate.log
          import re, struct, sys
          from pathlib import Path
          k = Path('out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho')
          d = k.read_bytes()
          ncmds = struct.unpack_from('<I', d, 16)[0]
          p, base, symtabs = 32, None, []
          for _ in range(ncmds):
              cmd, size = struct.unpack_from('<II', d, p)
              if cmd == 0x19 and d[p + 8:p + 24].rstrip(b'\0') == b'__TEXT':
                  base = struct.unpack_from('<Q', d, p + 24)[0]
              elif cmd == 0x80000035:
                  vm, fo = struct.unpack_from('<QQ', d, p + 8)
                  q = fo + 32
                  for _ in range(struct.unpack_from('<I', d, fo + 16)[0]):
                      c, s = struct.unpack_from('<II', d, q)
                      if c == 0x2:
                          symtabs.append(struct.unpack_from('<IIII', d, q + 8))
                      q += s
              p += size
          assert base, 'no __TEXT segment'
          stub = None
          for symoff, nsyms, stroff, strsize in symtabs:
              strs = d[stroff:stroff + strsize]
              for i in range(nsyms):
                  strx, ntype, nsect, ndesc, nval = struct.unpack_from('<IBBHQ', d, symoff + i * 16)
                  if nval and strs[strx:strs.find(b'\0', strx)] == b'_unixnu_fileset_unmapped':
                      stub = nval
          print('__TEXT base       %#x' % base)
          print('panic stub        %s' % ('%#x' % stub if stub else 'ABSENT (patch not applied)'))
          count = 0
          if stub:
              low = (stub - base) & 0xFFFFFFFFFFFF
              for off in range(0, len(d) - 8, 8):
                  if struct.unpack_from('<Q', d, off)[0] & 0xFFFFFFFFFFFF == low:
                      count += 1
              print('pointer low48     %#x' % low)
          print('STUB_SLOTS        %d' % count)
          Path('../p4-report/stub-gate.txt').write_text(
              'kernel.macho sha256 %s\n__TEXT base %#x\npanic stub %s\nSTUB_SLOTS %d\n'
              % (__import__('hashlib').sha256(d).hexdigest(), base, '%#x' % stub if stub else 'absent', count))
          sys.exit(0 if count == 0 else 1)
          PY
          cat ../p4-report/stub-gate.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build firmware
        working-directory: unixnu
        run: |
          set -uo pipefail
          ./unixnu build package -D ../device 2>&1 | tee -a ../p4-report/build.log
          ./unixnu build firmware -D ../device --uefi ../uefi-ishtar 2>&1 | tee -a ../p4-report/build.log
          FD=../uefi-ishtar/Build/ishtarPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          test -f "$FD" || { echo "SILICIUM_UEFI.fd MISSING"; exit 1; }
          echo "FD $(stat -f%z "$FD") bytes sha256 $(shasum -a 256 "$FD" | cut -d' ' -f1)" | tee -a ../p4-report/artifacts.txt
          test "$(stat -f%z "$FD")" = "3145728"

      - name: Build the safe-checkpoint payload
        working-directory: unixnu
        run: |
          set -uo pipefail
          TC=build/original-static-system-trust/original-static-system.bundle
          ./unixnu build payload -D ../device --trust-cache "$TC" \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" 2>&1 | tee -a ../p4-report/build.log
          P=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/payload/payload.json
          test -f "$P" || { echo "payload.json MISSING"; exit 1; }
          echo "== kernel arg safety ==" | tee ../p4-report/safety.txt
          for bad in sheng-data-persist sheng-data-reset native-ufs-root native-source-storage; do
            if grep -q "$bad" "$P"; then echo "UNSAFE $bad present" | tee -a ../p4-report/safety.txt; else echo "SAFE $bad absent" | tee -a ../p4-report/safety.txt; fi
          done
          if [ "${{ inputs.device_ref }}" = "safe-checkpoint" ]; then
            ! grep -q -E 'sheng-data-persist|sheng-data-reset|native-ufs-root|native-source-storage' "$P"
          else
            echo "dual-boot/persistent root: root-write args are expected on ${{ inputs.device_ref }}"
          fi

      - name: bootimg (header v0)
        working-directory: unixnu
        run: |
          set -uo pipefail
          ./unixnu bootimg -D ../device --uefi ../uefi-ishtar --dtb out/ipsw/24A446/ishtar.dtb 2>&1 | tee -a ../p4-report/build.log
          B=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.img
          J=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.json
          test -f "$B" || { echo "boot.img MISSING"; exit 1; }
          cp "$J" ../p4-report/boot.json
          echo "boot.img $(stat -f%z "$B") bytes sha256 $(shasum -a 256 "$B" | cut -d' ' -f1)" | tee -a ../p4-report/artifacts.txt
          python3 - <<'PY' | tee ../p4-report/boot-verification.txt
          import json
          d = json.load(open('../p4-report/boot.json'))
          print('header_version =', d.get('header_version'))
          print('ramdisk_bytes  =', d.get('ramdisk_bytes'))
          print('pagesize       =', d.get('pagesize'))
          assert d.get('header_version') == 0
          assert (d.get('ramdisk_bytes') or 0) > 0
          print('BOOTIMG PASS')
          PY

      - name: Private Release (boot.img + manifest only)
        if: success()
        working-directory: unixnu
        run: |
          set -euo pipefail
          TAG="checkpoint-${{ github.run_id }}"
          B=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/boot/boot.img
          SHA=$(shasum -a 256 "$B" | cut -d' ' -f1)
          {
            echo "# ishtar safe checkpoint"
            echo
            echo "boot.img sha256: $SHA"
            echo "bytes: $(stat -f%z "$B")"
            echo
            echo "header_version=0 (v1 drops USB with the 176 MiB ramdisk)"
            echo "The default xnu entry carries no sheng-data-persist / sheng-data-reset / native-ufs-root / native-source-storage."
            echo "WARNING: the Install and boot menu entry adds sheng-data-reset=1/2 and ERASES Android user data. Do not select it."
            echo "payload.adt.persistent_data=false. fastboot boot only; NEVER flash userdata."
            echo
            echo "Run yourself: fastboot boot boot.img"
            echo "Expected: UniXNU menu -> DarwinBoot -> first -v XNU console line."
            echo "UFS root mount will fail; that is the checkpoint boundary."
          } > ../p4-report/RELEASE.md
          cat ../p4-report/RELEASE.md
          payload=$(python3 -c "import json;print(json.dumps({'tag_name':'$TAG','name':'ishtar safe checkpoint (private)','body':open('../p4-report/RELEASE.md').read(),'draft':False,'prerelease':True}))")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/ishtar-device/releases" -d "$payload" > ../p4-report/release.json
          RID=$(python3 -c "import json;print(json.load(open('../p4-report/release.json'))['id'])")
          cp ../p4-report/boot.json ../p4-report/boot.json.txt
          FILES=("$B" ../p4-report/boot.json.txt ../p4-report/RELEASE.md)
          for extra in ../p4-report/p5-unmapped.txt ../p4-report/pairing.log ../p4-report/p5-context.txt; do
            [ -f "$extra" ] && FILES+=("$extra")
          done
          if [ "$PUBLISH_KERNELCACHE" = true ]; then
            KC=out/ipsw/24A446/kernelcache.decompressed
          K=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          R=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf

            MAP=out/ishtar/ios-27.0.1-24A446/ishtar_ios27/kernel/kernel.macho.map.json
            [ -f "$KC" ] && FILES+=("$KC")
          [ -f "$K" ] && FILES+=("$K")
          [ -f "$R" ] && FILES+=("$R")
            if [ -f "$MAP" ]; then
              cp "$MAP" ../p4-report/kernel.macho.map.json
              FILES+=(../p4-report/kernel.macho.map.json)
            fi
          fi
          if [ -f ../p4-report/userdata-root.img ]; then
            FILES+=(../p4-report/userdata-root.img)
          fi
          if [ -f ../p4-report/userdata-root.json ]; then
            FILES+=(../p4-report/userdata-root.json ../p4-report/userdata-verification.txt)
          fi
          for f in "${FILES[@]}"; do
            n=$(basename "$f")
            curl -fsSL -X POST -H "Authorization: Bearer $GH_PAT" -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$OWNER/ishtar-device/releases/$RID/assets?name=$n" \
              --data-binary "@$f" > /dev/null
          done
          echo "RELEASE tag=$TAG id=$RID" | tee ../p4-report/release.txt

      - name: Summary (sanitized, this repo is public)
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## ishtar safe checkpoint"
            echo
            cat p4-report/inputs.txt 2>/dev/null || true
            cat p4-report/artifacts.txt 2>/dev/null || true
            cat p4-report/safety.txt 2>/dev/null || true
            cat p4-report/boot-verification.txt 2>/dev/null || true
            cat p4-report/userdata-verification.txt 2>/dev/null || true
            cat p4-report/release.txt 2>/dev/null || true
            echo
            echo "Private sources: ConCosew/ishtar-unixnu, ishtar-device, ishtar-uefi, ishtar-device-binaries."
            echo "No images, no proprietary binaries and no platform seed are published by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
