name: porting-record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ConCosew/ishtar-device
          ref: gpu-runtime
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
          path: device
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the comparison branch
        run: git -C device fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate structure and changed areas
        run: |
          python3 tools/scripts/porting-record.py check --device device --base refs/remotes/origin/main
