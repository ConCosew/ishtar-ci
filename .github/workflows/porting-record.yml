name: porting-record
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ConCosew/ishtar-device
        ref: 557360a0649a46de79832bd4d01ef02fb0def263
        token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
        path: device
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU
        ref: main
        path: tools
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate structure and changed areas
      run: 'python3 tools/scripts/porting-record.py check --device device --base refs/remotes/origin/main

        '
'on':
  workflow_dispatch: null
