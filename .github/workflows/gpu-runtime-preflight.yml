name: gpu-runtime-preflight
on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: ishtar-unixnu ref
        required: true
        default: gpu-stage3
      device_ref:
        description: ishtar-device ref
        required: true
        default: gpu-stage3
jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GH_PAT: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
      OWNER: ConCosew
    steps:
      - name: Check out the private UniXNU build tree
        uses: actions/checkout@v4
        with:
          repository: ConCosew/ishtar-unixnu
          ref: ${{ inputs.unixnu_ref }}
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
          path: unixnu
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the private device repository
        uses: actions/checkout@v4
        with:
          repository: ConCosew/ishtar-device
          ref: ${{ inputs.device_ref }}
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN }}
          path: device
          persist-credentials: false
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: ishtar-ci
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Host tools
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install -q llvm lld meson ninja bison glslang || true
          python3 -m pip install --quiet --upgrade pip
      - name: Submodules and upstream runtime scripts
        working-directory: unixnu
        run: |
          set -euo pipefail
          for d in drivers/Adreno740 drivers/AdrenoMetal kits/AdrenoPM4 kits/AdrenoFirmware kits/ArmSmmu4K; do
            git submodule update --init --depth 1 "$d"
          done
          # Use only the two upstream runtime scripts as diagnostics. They are not committed to the branch.
          mkdir -p ../runtime-upstream/scripts
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          token = os.environ['GH_PAT']
          out = Path('../runtime-upstream')
          for name in ('scripts/build-boot-runtime.py', 'scripts/build-adreno-metal-plugin.py'):
              url = f'https://api.github.com/repos/UniXNU/UniXNU/contents/{name}?ref=main'
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  document = json.load(response)
              (out / name).write_bytes(base64.b64decode(document['content']))
              Path(name).write_bytes((out / name).read_bytes())
              print('staged', name)
          PY
          test -s scripts/data/adreno-compiler-inputs.json
          test -s scripts/data/gpu-metal-vulkan-inputs.json
      - name: Fetch pinned Mesa and metal2vulkan
        working-directory: unixnu
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          ROOT = Path('.')
          pins = json.loads((ROOT/'scripts/data/adreno-compiler-inputs.json').read_text())
          tr = json.loads((ROOT/'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          def checkout(path, pin):
            if not path.exists():
              path.mkdir(parents=True)
              subprocess.run(['git','init','-q',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'fetch','--depth=1',pin.get('mirror',pin['repository']),pin['commit']],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach','FETCH_HEAD'],check=True)
              return True
            got = subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()
            if got != pin['commit']:
              raise SystemExit(f'{path}: {got} != {pin["commit"]}')
            return False
          fresh = checkout(ROOT/'.cache/mesa-work', pins['mesa'])
          if fresh:
            for patch in pins['patches']:
              absolute = (ROOT/patch).resolve()
              subprocess.run(['git','-C',str((ROOT/'.cache/mesa-work').resolve()),'apply',str(absolute)],check=True)
          checkout(ROOT/'.cache/gpu-reference/metal2vulkan', tr)
          print('pinned sources ready')
          PY
      - name: Build Turnip and Metal plugin
        working-directory: unixnu
        run: |
          set -euo pipefail
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/python -m pip install -r scripts/requirements-adreno-compiler.txt
          # Xcode's /usr/bin/bison is too old for Mesa's -Wcounterexamples; the builder puts this directory first on PATH.
          mkdir -p .cache/mesa-tools/bin
          ln -sf "$(brew --prefix bison)/bin/bison" .cache/mesa-tools/bin/bison
          # The pinned Mesa darwin-kmd patch expects the current versioned ABI header. Override it only in this
          # isolated preflight workspace; the gpu-stage3 kernel link continues to use its verified Adreno740 gitlink.
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          url = 'https://api.github.com/repos/UniXNU/Adreno740/contents/NativeAdrenoABI.h?ref=main'
          request = urllib.request.Request(url, headers={'Authorization': f"Bearer {os.environ['GH_PAT']}", 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              document = json.load(response)
          Path('drivers/Adreno740/NativeAdrenoABI.h').write_bytes(base64.b64decode(document['content']))
          print('staged current NativeAdrenoABI.h for Turnip compile only')
          PY
          rm -rf build/mesa-tu-ios27
          python3 scripts/build-turnip-darwin.py --target ios27
          python3 scripts/build-adreno-metal-plugin.py --target ios27 --no-replay
      - name: GPU runtime build log (analysis only)
        if: ${{ always() }}
        working-directory: unixnu
        run: |
          set -uo pipefail
          for f in .cache/mesa-tu-ios27-configure.log .cache/mesa-tu-ios27-build.log; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              tail -160 "$f"
            fi
          done
      - name: Pack GPU addon
        working-directory: unixnu
        run: |
          set -euo pipefail
          ADRENO_PLUGIN_DIR=build/adreno-metal-plugin27 \
            python3 scripts/make-gpu-addon.py --publish --no-daemon out/gpuaddon.bin
          test -s out/gpuaddon.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('out/gpuaddon.bin'); b=p.read_bytes()
          assert b[:8]==b'NGPUADD2'
          print('GPUADDON',p.stat().st_size,hashlib.sha256(b).hexdigest())
          PY
